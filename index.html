<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo's 私房菜谱</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0f17;
  --bg-card: #1a1a2e;
  --bg-card-hover: #22223a;
  --gold: #c9a96e;
  --gold-light: #e0c68a;
  --gold-dim: #a68a50;
  --text: #e8e6e3;
  --text-muted: #9a9a9a;
  --border: #2a2a3e;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

html { scroll-behavior: smooth; }

body {
  font-family: "Noto Serif SC", "Source Serif Pro", "Georgia", "Songti SC", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

/* ========== Typography ========== */
h1, h2, h3, h4 {
  font-family: "Noto Serif SC", "Playfair Display", "Georgia", serif;
  color: var(--gold);
  font-weight: 600;
}

/* ========== Header ========== */
.site-header {
  text-align: center;
  padding: 80px 20px 40px;
  position: relative;
}

.site-header::after {
  content: '';
  display: block;
  width: 60px;
  height: 2px;
  background: var(--gold);
  margin: 30px auto 0;
}

.site-title {
  font-size: clamp(2rem, 5vw, 3.2rem);
  letter-spacing: 6px;
  margin-bottom: 12px;
}

.site-subtitle {
  font-family: "Playfair Display", "Source Serif Pro", Georgia, serif;
  font-size: clamp(0.85rem, 2vw, 1.05rem);
  color: var(--text-muted);
  font-style: italic;
  letter-spacing: 3px;
}

/* ========== Filter Tabs ========== */
.filter-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.filter-btn {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 8px 24px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 2px;
}

.filter-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold-light);
}

.filter-btn.active {
  background: var(--gold);
  color: var(--bg);
  border-color: var(--gold);
  font-weight: 600;
}

/* ========== Recipe Grid ========== */
.recipes-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 28px;
}

/* ========== Recipe Card ========== */
.recipe-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
  border: 1px solid var(--border);
  opacity: 0;
  transform: translateY(40px);
}

.recipe-card.visible {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.35s ease;
}

.recipe-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow), 0 0 30px rgba(201,169,110,0.08);
}

.card-image {
  width: 100%;
  height: 220px;
  background: #16162a;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-image .emoji-placeholder {
  font-size: 4.5rem;
  filter: saturate(0.8);
}

.card-category {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(15,15,23,0.82);
  color: var(--gold);
  font-size: 0.75rem;
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 2px;
  border: 1px solid rgba(201,169,110,0.3);
  backdrop-filter: blur(6px);
}

.card-body {
  padding: 22px 24px 26px;
}

.card-title {
  font-size: 1.35rem;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.card-desc {
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 16px;
}

.card-meta {
  display: flex;
  gap: 16px;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.card-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-meta .meta-icon {
  color: var(--gold-dim);
}

/* ========== Detail Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
  padding: 40px 16px;
  backdrop-filter: blur(4px);
}

.modal-overlay.open {
  display: flex;
}

.modal-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 780px;
  width: 100%;
  position: relative;
  animation: modalIn 0.35s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(30px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-close {
  position: absolute;
  top: 18px;
  right: 20px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.6rem;
  cursor: pointer;
  z-index: 10;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.2s;
}

.modal-close:hover {
  background: rgba(201,169,110,0.15);
  color: var(--gold);
}

.detail-hero {
  width: 100%;
  height: 300px;
  background: #16162a;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius) var(--radius) 0 0;
  overflow: hidden;
  position: relative;
}

.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.detail-hero .emoji-placeholder {
  font-size: 6rem;
}

.detail-body {
  padding: 36px 40px 40px;
}

.detail-header {
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.detail-title {
  font-size: 1.8rem;
  margin-bottom: 10px;
  letter-spacing: 3px;
}

.detail-desc {
  color: var(--text-muted);
  font-size: 0.95rem;
  margin-bottom: 18px;
}

.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  font-size: 0.85rem;
}

.detail-meta-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 18px;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border);
}

.detail-meta-item .label {
  color: var(--text-muted);
  font-size: 0.75rem;
  letter-spacing: 1px;
}

.detail-meta-item .value {
  color: var(--gold);
  font-weight: 600;
}

/* Sections */
.detail-section {
  margin-bottom: 32px;
}

.detail-section-title {
  font-size: 1.15rem;
  margin-bottom: 16px;
  padding-left: 14px;
  border-left: 3px solid var(--gold);
  letter-spacing: 2px;
}

/* Ingredients */
.ingredients-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}

.ingredient-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: var(--bg-card);
  border-radius: 8px;
  font-size: 0.9rem;
  border: 1px solid var(--border);
}

.ingredient-item .name { color: var(--text); }
.ingredient-item .amount {
  color: var(--gold);
  font-size: 0.82rem;
  white-space: nowrap;
  margin-left: 10px;
}
.ingredient-item .note {
  color: var(--text-muted);
  font-size: 0.75rem;
}

/* Steps */
.steps-list {
  list-style: none;
  counter-reset: step;
}

.step-item {
  counter-increment: step;
  display: flex;
  gap: 18px;
  margin-bottom: 18px;
  padding: 16px 20px;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.92rem;
  line-height: 1.8;
}

.step-number {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  background: var(--gold);
  color: var(--bg);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  margin-top: 2px;
}

/* Tips */
.tips-list {
  list-style: none;
}

.tip-item {
  padding: 10px 16px 10px 20px;
  margin-bottom: 8px;
  background: rgba(201,169,110,0.06);
  border-left: 2px solid var(--gold-dim);
  border-radius: 0 8px 8px 0;
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.7;
}

/* Navigation */
.detail-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}

.nav-btn {
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.88rem;
  transition: all 0.25s;
  letter-spacing: 1px;
}

.nav-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold);
  background: var(--bg-card-hover);
}

.nav-btn .arrow { color: var(--gold); font-size: 1.1rem; }

/* ========== Footer ========== */
.site-footer {
  text-align: center;
  padding: 40px 20px 50px;
  color: var(--text-muted);
  font-size: 0.82rem;
  letter-spacing: 1px;
  border-top: 1px solid var(--border);
}

.site-footer .heart { color: var(--gold); }

/* ========== Empty State ========== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.empty-state .emoji { font-size: 3rem; margin-bottom: 16px; }
.empty-state p { font-size: 0.95rem; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .site-header { padding: 50px 16px 30px; }
  .recipe-grid { grid-template-columns: 1fr; gap: 20px; }
  .recipes-container { padding: 0 16px 60px; }
  .detail-body { padding: 24px 20px 28px; }
  .detail-hero { height: 220px; }
  .detail-title { font-size: 1.45rem; }
  .ingredients-grid { grid-template-columns: 1fr; }
  .detail-meta { gap: 10px; }
  .detail-meta-item { padding: 8px 14px; }
  .modal-overlay { padding: 20px 10px; }
  .card-image { height: 190px; }
  .filter-btn { padding: 7px 18px; font-size: 0.85rem; }
}

@media (max-width: 400px) {
  .recipe-grid { grid-template-columns: 1fr; }
  .card-body { padding: 16px 18px 20px; }
  .detail-body { padding: 20px 16px 24px; }
  .nav-btn { padding: 8px 14px; font-size: 0.82rem; }
}

/* ========== Fonts ========== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <h1 class="site-title">私房菜谱</h1>
  <p class="site-subtitle">Leo's Private Kitchen</p>
</header>

<!-- Filter -->
<nav class="filter-bar">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="硬菜">硬菜</button>
  <button class="filter-btn" data-filter="家常菜">家常菜</button>
  <button class="filter-btn" data-filter="素菜">素菜</button>
</nav>

<!-- Recipe Grid -->
<main class="recipes-container">
  <div class="recipe-grid" id="recipeGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="emoji">🍽️</div>
    <p>该分类下暂无菜谱</p>
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content" id="modalContent">
    <button class="modal-close" id="modalClose">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Footer -->
<footer class="site-footer">
  <p>用 <span class="heart">♥</span> 烹饪 · Leo's Private Kitchen · 2026</p>
</footer>

<script>
// ========== Recipe Data (embedded) ==========
const recipes = [
  {
    id: "yu-tou-tang",
    name: "鱼头汤",
    emoji: "🐟",

    description: "奶白浓郁的鱼头汤，鲜美滋补，一碗暖到心里。",

      { name: "料酒", amount: "2勺", note: "" },
      { name: "盐", amount: "适量", note: "" },
      { name: "白胡椒粉", amount: "少许", note: "" },
      { name: "食用油", amount: "适量", note: "" },

    ],
    steps: [
      "鱼头对半劈开，去除鱼鳃，清洗干净，用厨房纸巾擦干表面水分。",
      "锅中倒入适量油，中大火烧至七成热，放入鱼头煎至两面金黄，约每面3分钟。",
      "煎鱼头时放入姜片和葱段一起煸香。",
      "沿锅边淋入料酒，随后倒入足量开水（一定要用开水，这是汤色奶白的关键）。",
      "大火煮沸后保持大火滚煮10分钟，汤色开始变白。",
      "转中火继续煮20分钟，期间放入切块的豆腐。",
      "出锅前加盐和白胡椒粉调味，撒上枸杞和香菜即可。"
    ],
    tips: [
      "鱼头一定要擦干再煎，否则容易粘锅和溅油。",

      "全程保持中大火，小火炖出来的汤会偏清澈。",

      { name: "番茄酱", amount: "2勺", note: "" },

      "锅中倒油烧热，放入小排中火煎至表面微焦，约5-6分钟。",

      "转中小火加盖焖煮约25分钟，期间翻动几次防止粘锅。",

    ],
    tips: [
      "低温慢烤是关键，温度太高肉会发柴。",

  {

// ========== Image Helper ==========
function getRecipeImage(recipe, isDetail) {
  const img = new Image();
  const src = `images/${recipe.id}.jpg`;
  const sizeClass = isDetail ? 'detail' : 'card';

  return new Promise(resolve => {
    img.onload = () => resolve(`<img src="${src}" alt="${recipe.name}" loading="lazy">`);
    img.onerror = () => resolve(`<span class="emoji-placeholder">${recipe.emoji}</span>`);
    img.src = src;
  });
}

// Sync version: try img, fallback emoji via onerror
function recipeImageHTML(recipe) {
  return `<img src="images/${recipe.id}.jpg" alt="${recipe.name}" loading="lazy"
    onerror="this.parentNode.innerHTML='<span class=\\'emoji-placeholder\\'>${recipe.emoji}</span>'"
  >`;
}

// ========== Render Cards ==========
const grid = document.getElementById('recipeGrid');
const emptyState = document.getElementById('emptyState');
let currentFilter = 'all';

function renderCards(filter) {
  currentFilter = filter;
  const filtered = filter === 'all' ? recipes : recipes.filter(r => r.category === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  grid.innerHTML = filtered.map((r, i) => `
    <article class="recipe-card" data-id="${r.id}" style="transition-delay: ${i * 0.08}s">
      <div class="card-image">
        ${recipeImageHTML(r)}
        <span class="card-category">${r.category}</span>
      </div>
      <div class="card-body">
        <h3 class="card-title">${r.name}</h3>
        <p class="card-desc">${r.description}</p>
        <div class="card-meta">
          <span><span class="meta-icon">⏱</span> ${r.cook_time}</span>
          <span><span class="meta-icon">👥</span> ${r.servings}</span>
          <span><span class="meta-icon">📊</span> ${r.difficulty}</span>
        </div>
      </div>
    </article>
  `).join('');

  // Trigger scroll animations
  requestAnimationFrame(() => {
    observeCards();
  });
}

// ========== Scroll Animation ==========
function observeCards() {
  const cards = document.querySelectorAll('.recipe-card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  cards.forEach(card => observer.observe(card));
}

// ========== Filter ==========
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});

// ========== Detail Modal ==========
const overlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');
let currentRecipeIndex = -1;

function getFilteredRecipes() {
  return currentFilter === 'all' ? recipes : recipes.filter(r => r.category === currentFilter);
}

function openDetail(recipeId) {
  const filtered = getFilteredRecipes();
  const idx = filtered.findIndex(r => r.id === recipeId);
  if (idx === -1) return;
  currentRecipeIndex = idx;
  renderDetail(filtered[idx], filtered);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderDetail(recipe, filtered) {
  const prevRecipe = currentRecipeIndex > 0 ? filtered[currentRecipeIndex - 1] : null;
  const nextRecipe = currentRecipeIndex < filtered.length - 1 ? filtered[currentRecipeIndex + 1] : null;

  modalBody.innerHTML = `
    <div class="detail-hero">
      ${recipeImageHTML(recipe)}
    </div>
    <div class="detail-body">
      <div class="detail-header">
        <h2 class="detail-title">${recipe.name}</h2>
        <p class="detail-desc">${recipe.description}</p>
        <div class="detail-meta">
          <div class="detail-meta-item"><span class="label">准备时间</span><span class="value">${recipe.prep_time}</span></div>
          <div class="detail-meta-item"><span class="label">烹饪时间</span><span class="value">${recipe.cook_time}</span></div>
          <div class="detail-meta-item"><span class="label">份量</span><span class="value">${recipe.servings}</span></div>
          <div class="detail-meta-item"><span class="label">难度</span><span class="value">${recipe.difficulty}</span></div>
        </div>
      </div>

      <div class="detail-section">
        <h3 class="detail-section-title">食材清单</h3>
        <div class="ingredients-grid">
          ${recipe.ingredients.map(ing => `
            <div class="ingredient-item">
              <span class="name">${ing.name}</span>
              <span class="amount">${ing.amount}${ing.note ? ` <span class="note">(${ing.note})</span>` : ''}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="detail-section">
        <h3 class="detail-section-title">烹饪步骤</h3>
        <ol class="steps-list">
          ${recipe.steps.map((step, i) => `
            <li class="step-item">
              <span class="step-number">${i + 1}</span>
              <span>${step}</span>
            </li>
          `).join('')}
        </ol>
      </div>

      <div class="detail-section">
        <h3 class="detail-section-title">小贴士</h3>
        <ul class="tips-list">
          ${recipe.tips.map(tip => `<li class="tip-item">${tip}</li>`).join('')}
        </ul>
      </div>

      <div class="detail-nav">
        ${prevRecipe
          ? `<button class="nav-btn" onclick="navigateRecipe(-1)"><span class="arrow">‹</span> ${prevRecipe.name}</button>`
          : `<div></div>`}
        ${nextRecipe
          ? `<button class="nav-btn" onclick="navigateRecipe(1)">${nextRecipe.name} <span class="arrow">›</span></button>`
          : `<div></div>`}
      </div>
    </div>
  `;

  // Scroll modal to top
  overlay.scrollTop = 0;
}

function navigateRecipe(direction) {
  const filtered = getFilteredRecipes();
  const newIndex = currentRecipeIndex + direction;
  if (newIndex < 0 || newIndex >= filtered.length) return;
  currentRecipeIndex = newIndex;
  renderDetail(filtered[newIndex], filtered);
  overlay.scrollTop = 0;
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

// Event: click card to open
grid.addEventListener('click', (e) => {
  const card = e.target.closest('.recipe-card');
  if (card) openDetail(card.dataset.id);
});

// Event: close modal
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

// Event: keyboard
document.addEventListener('keydown', (e) => {
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') navigateRecipe(-1);
  if (e.key === 'ArrowRight') navigateRecipe(1);
});

// ========== Init ==========
renderCards('all');
</script>
